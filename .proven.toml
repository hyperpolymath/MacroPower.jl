# SPDX-License-Identifier: MPL-2.0
# Manifest for this repository (schema proven/manifest/v1); see
# hyperpolymath/proven-cicd-and-workflows docs/PROVEN-ADOPTION.adoc.
#
# Detected: julia (Project.toml, src/MacroPower.jl, test/, benches/) and shell
# (setup.sh). The umbrella cannot provision julia in release 0.1, and setup.sh is
# a bootstrap script with no tests, so both are accounted for as ignored
# languages rather than passed.

schema = "proven/manifest/v1"

[languages.ignore.julia]
reason = "the umbrella cannot provision julia in release 0.1. A real suite exists: test/runtests.jl (plus test/e2e_test.jl, test/property_test.jl) and benches/benchmarks.jl, run by .github/workflows/ci.yml via Pkg.test(). It is not exercised by proven until a julia runner lands."

[languages.ignore.shell]
reason = "one bootstrap script (setup.sh: platform detection, installs just). It has no tests and nothing for the umbrella to run."

# No [bench.*]: benches/benchmarks.jl is a BenchmarkTools script that needs julia,
# which the umbrella cannot provision in release 0.1, so a bench target here would
# fail rather than measure. Add one when a julia runner exists.
